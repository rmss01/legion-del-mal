name: Acceso Fortaleza

on: workflow_dispatch

jobs:

  acceso-a-la-fortaleza:

    runs-on: ubuntu-latest

    steps:

      - name: El agente llega a la fortaleza  
        run: |
          echo "Agente ${{ github.actor }} llega a la base"
          echo ""
          echo "Buscar los archivos de la legión"
          ls -la
          echo ""
          echo "X pero qué pasó? no hay nada"

      - name: "Brainiac desbloquea la bóveda"
        ## Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        uses: actions/checkout@v4

      - name: Ahora si, vamos a ver los planes
        run: |
          echo "Buscar los archivos de la legión"
          ls -la
          echo "Funciona!!"
          echo ""
          echo "Planes:"
          ls planes/
          echo "Villanos:"
          ls miembros/
          echo "Inteligencia:"
          ls inteligencia/