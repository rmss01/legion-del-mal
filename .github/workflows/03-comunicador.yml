# This is a basic workflow to help you get started with Actions

name: Comunicador de la Legión

on:
 
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac

      prioridad:
        description: "¿Qué prioridad tiene el mensaje?"
        required: true
        type: choice
        options:
          - Normal
          - Baja
          - Alta

      mensaje:
        description: "Mensaje:"
        required: true
        type: text
        default: "La misión fue un éxito"

      cow:
        description: "Selecciona el cow caracter"
        required: true
        type: choice
        options:
          - ghost
          - ghostbusters
          - milk

jobs:

  transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      - name: Instalar el transmisor de la Legión
        run: sudo apt-get install -y cowsay
      
      - name: Imprimir inputs
        run: |
          echo "============================="
          echo "  Transmisión interceptada  "
          echo "============================="
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo "Prioridad: ${{ inputs.prioridad }}"
          echo "----- Mensaje -----"
          cowsay -f "${{ inputs.cow}}" "${{ inputs.mensaje }}"
          echo "-------------------"
          echo "Fecha: $(date -u +"%d-%m-%y - %H:%M UTC")"
          echo "..."